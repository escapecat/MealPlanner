<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>能做什么 / 排除了什么</title>
<link rel="stylesheet" href="app/style.css">
<style>
  .wrap { max-width: 900px; }
  .cols { display: grid; grid-template-columns: 1fr; gap: var(--gap); }
  @media (min-width: 780px) { .cols { grid-template-columns: 1fr 1fr; } }
  .lst { max-height: 62vh; overflow-y: auto; }
  .ln { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .ln:last-child { border-bottom: 0; }
  .why { font-size: 12px; color: var(--danger); }
  .dim { font-size: 12px; color: var(--text-dim); }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px;
         background: var(--surface-2); color: var(--text-dim); margin-left: 6px; }
  textarea { width: 100%; min-height: 70px; font: inherit; font-size: 12px;
             background: var(--surface); color: var(--text);
             border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
</style>
</head>
<body>
<div id="out" class="wrap"></div>

<script src="app/data/ingredients.js"></script>
<script src="app/data/recipes.js"></script>
<script src="app/data/packages.js"></script>
<script src="app/core/equipment.js"></script>
<script src="app/core/timing.js"></script>
<script src="app/core/catalog.js"></script>
<script>
// 「按当前条件,哪些能做、哪些被排除、分别因为什么」的一页报告。
//
// ⚠️ 过滤逻辑一行都不在这里重写 —— 全走 Catalog.explain(),
//    它和求解器用的 availableVariants 是同一套判断(实测 535 道 0 偏差)。
//    报告要是自己写一份过滤,迟早出现「报告说能做、求解器不排」,那时候没法查。
//
// 读不到你浏览器里的设置(这是另一个页面),所以:
//   要么用下面的控件调,要么把「我的 → 数据 → 导出备份」的 JSON 粘进来。

var cfg = {
  equipment: ['炒锅', '汤锅'],
  maxSpicy: 3, maxActiveMinutes: 45, maxDifficulty: 3,
  maxIdleWait: 120, allowOvernight: false, blacklist: [],
};

function h(t, a, k) {
  var n = document.createElement(t);
  Object.keys(a || {}).forEach(function (x) {
    if (x === 'class') n.className = a[x];
    else if (x.indexOf('on') === 0) n.addEventListener(x.slice(2), a[x]);
    else if (a[x] != null) n.setAttribute(x, a[x]);
  });
  (k || []).forEach(function (c) {
    if (c == null) return;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return n;
}

function seg(label, get, set, opts, hint) {
  return h('div', { class: 'row' }, [
    h('label', { class: 'lab' }, [label]),
    h('div', { class: 'seg' }, opts.map(function (o) {
      return h('button', {
        type: 'button', 'aria-pressed': String(get() === o.v),
        onclick: function () { set(o.v); render(); },
      }, [o.t]);
    })),
    hint ? h('div', { class: 'hint' }, [hint]) : null,
  ]);
}

var CUISINE = { '01': '家常基础', '02': '川湘云贵', '03': '粤浙闽',
                '04': '北方家常', '05': '西式', '06': '日韩东南亚' };

function render() {
  var out = document.getElementById('out');
  out.innerHTML = '';
  out.appendChild(h('h1', {}, ['能做什么 / 排除了什么']));

  var dishes = RECIPES.filter(function (r) { return r.type !== 'prep'; });
  var res = dishes.map(function (r) { return Catalog.explain(r, cfg); });
  var can = res.filter(function (e) { return e.ok; });
  var no = res.filter(function (e) { return !e.ok; });

  out.appendChild(h('div', { class: 'note' }, [
    '可做 ' + can.length + ' 道 · 排除 ' + no.length + ' 道(共 ' + dishes.length + ' 道)。' +
    '过滤逻辑和求解器是同一套 —— 这里显示能做的,生成计划时就真能排到。',
  ]));

  // ---- 控件 ----
  var box = h('div', { class: 'card' });
  box.appendChild(h('div', { style: 'font-weight:600;margin-bottom:10px' }, ['条件']));

  box.appendChild(h('div', { class: 'row' }, [
    h('label', { class: 'lab' }, ['厨具(点一下切换)']),
    h('div', { class: 'chips' }, Catalog.equipment().map(function (e) {
      var on = cfg.equipment.indexOf(e.name) >= 0;
      return h('button', {
        type: 'button', 'aria-pressed': String(on),
        onclick: function () {
          if (on) cfg.equipment = cfg.equipment.filter(function (x) { return x !== e.name; });
          else cfg.equipment = cfg.equipment.concat([e.name]);
          render();
        },
      }, [e.name + ' ' + e.count]);
    })),
  ]));

  box.appendChild(seg('愿意做多难的', function () { return cfg.maxDifficulty; },
    function (v) { cfg.maxDifficulty = v; },
    [{ v: 2, t: '只要简单的' }, { v: 3, t: '中等' }, { v: 4, t: '有点挑战' }, { v: 5, t: '不限' }]));

  box.appendChild(seg('单顿动手上限', function () { return cfg.maxActiveMinutes; },
    function (v) { cfg.maxActiveMinutes = v; },
    [{ v: 20, t: '20 分' }, { v: 30, t: '30 分' }, { v: 45, t: '45 分' }, { v: 999, t: '不限' }]));

  box.appendChild(seg('最多能等多久', function () { return cfg.maxIdleWait; },
    function (v) { cfg.maxIdleWait = v; },
    [{ v: 30, t: '30 分' }, { v: 60, t: '1 小时' }, { v: 120, t: '2 小时' },
     { v: 240, t: '4 小时' }, { v: 99999, t: '不限' }], '焖 / 炖 / 腌 / 泡发的空等'));

  box.appendChild(seg('接受隔夜准备', function () { return cfg.allowOvernight !== false; },
    function (v) { cfg.allowOvernight = v; },
    [{ v: false, t: '不接受' }, { v: true, t: '可以' }]));

  box.appendChild(seg('能吃多辣', function () { return cfg.maxSpicy; },
    function (v) { cfg.maxSpicy = v; },
    [{ v: 0, t: '不吃辣' }, { v: 1, t: '微辣' }, { v: 2, t: '中辣' }, { v: 3, t: '重辣' }]));

  box.appendChild(h('div', { class: 'row' }, [
    h('label', { class: 'lab' }, ['或者:把「我的 → 数据 → 导出备份」的 JSON 粘这儿']),
    h('textarea', { id: 'imp', placeholder: '{"config":{...}} —— 粘完点下面的按钮' }),
    h('button', {
      class: 'btn ghost', style: 'margin-top:8px',
      onclick: function () {
        var t = document.getElementById('imp').value.trim();
        if (!t) return;
        try {
          var j = JSON.parse(t);
          var c = j.config || j;
          ['equipment', 'maxSpicy', 'maxActiveMinutes', 'maxDifficulty',
           'maxIdleWait', 'allowOvernight'].forEach(function (k) {
            if (c[k] !== undefined) cfg[k] = c[k];
          });
          cfg.blacklist = Catalog.expandBlacklist(c.blacklist || []);
          render();
        } catch (e) {
          alert('这段 JSON 读不了:' + e.message);
        }
      },
    }, ['用这份配置']),
  ]));
  out.appendChild(box);

  // ---- 两栏 ----
  var cols = h('div', { class: 'cols' });

  // 能做的:按菜系分组统计 + 列表
  var okBox = h('div', { class: 'card' });
  var byC = {};
  can.forEach(function (e) {
    var k = CUISINE[e.recipe.file] || e.recipe.file;
    (byC[k] = byC[k] || []).push(e);
  });
  okBox.appendChild(h('div', { style: 'font-weight:600' }, ['能做 ' + can.length + ' 道']));
  okBox.appendChild(h('div', { class: 'dim', style: 'margin:4px 0 8px' }, [
    Object.keys(byC).sort(function (a, b) { return byC[b].length - byC[a].length; })
      .map(function (k) { return k + ' ' + byC[k].length; }).join(' · '),
  ]));
  var okList = h('div', { class: 'lst' });
  can.slice().sort(function (a, b) {
    return a.recipe.name.localeCompare(b.recipe.name, 'zh');
  }).forEach(function (e) {
    var lv = e.variants.filter(function (v) { return v.ok; });
    var best = lv[0].variant;
    okList.appendChild(h('div', { class: 'ln' }, [
      e.recipe.name,
      h('span', { class: 'tag' }, [e.recipe.method]),
      h('span', { class: 'tag' }, [Timing.fmt(Timing.ofMeal(best, null).eatIn) + '能吃上']),
      h('span', { class: 'tag' }, ['难度 ' + best.difficulty]),
      lv.length < e.variants.length
        ? h('span', { class: 'tag' }, ['只剩 ' + lv.map(function (v) { return v.prepLevel; }).join('/') + ' 档'])
        : null,
    ]));
  });
  okBox.appendChild(okList);
  cols.appendChild(okBox);

  // 排除的:按原因归类 —— 这才是这一页的重点
  var noBox = h('div', { class: 'card' });
  var byWhy = {};
  no.forEach(function (e) {
    // 一道菜所有档位都被拦,取第一个档位的第一条原因当代表
    var first = (e.variants[0] && e.variants[0].reasons[0]) || '未知';
    var key = first.replace(/[((].*$/, '').replace(/\d+/g, 'N').trim();
    (byWhy[key] = byWhy[key] || []).push(e);
  });
  noBox.appendChild(h('div', { style: 'font-weight:600' }, ['排除 ' + no.length + ' 道']));
  noBox.appendChild(h('div', { class: 'dim', style: 'margin:4px 0 8px' }, ['按原因归类,点得开']));
  var noList = h('div', { class: 'lst' });
  Object.keys(byWhy).sort(function (a, b) { return byWhy[b].length - byWhy[a].length; })
    .forEach(function (k) {
      var rows = byWhy[k];
      noList.appendChild(h('div', { class: 'ln', style: 'font-weight:600' }, [
        k + ' —— ' + rows.length + ' 道',
      ]));
      rows.slice().sort(function (a, b) {
        return a.recipe.name.localeCompare(b.recipe.name, 'zh');
      }).forEach(function (e) {
        noList.appendChild(h('div', { class: 'ln', style: 'padding-left:12px' }, [
          h('span', { class: 'dim' }, [e.recipe.name]),
          h('div', { class: 'why' }, [
            e.variants.map(function (v) {
              return v.prepLevel + ':' + v.reasons.join(' / ');
            }).join('    |    '),
          ]),
        ]));
      });
    });
  noBox.appendChild(noList);
  cols.appendChild(noBox);

  out.appendChild(cols);
  out.appendChild(h('div', { class: 'hint', style: 'margin-top:12px' }, [
    '这一页是只读的,改这里的条件不会影响 app —— 想真的改,去「我的 → 厨房与口味」。',
  ]));
}

render();
</script>
</body>
</html>
