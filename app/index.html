<!DOCTYPE html>

<head>

<title>一人食计划</title>

<!-- 「添加到主屏幕」那一套。
     ⚠️ iOS **不读 manifest** 里的 display / icon,得单独给下面这三行,
        少了就会:图标变成页面截图、打开时顶上还挂着 Safari 的地址栏。
     ⚠️ theme-color 影响的是状态栏那条颜色 —— 不给的话是白的,和绿色顶栏断开。 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6f4e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="一人食">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<link rel="stylesheet" href="style.css?v=08100315">
</head>
<body>

<div id="app"></div>

<!-- 数据层:用 <script src> 加载而不是 fetch —— .json 在 file:// 下会被 CORS 拦掉,
     .js 双击就能跑。迁小程序时每个文件末尾那行 module.exports 直接生效。 -->
<script src="data/ingredients.js?v=08100315"></script>
<script src="data/recipes.js?v=08100315"></script>
<script src="data/packages.js?v=08100315"></script>
<script src="data/pinyin.js?v=08100315"></script>

<!-- 抽象层:迁小程序时只有 store.js 要改 -->
<script src="lib/store.js?v=08100315"></script>

<!-- 菜谱校准层:必须在别的 core 模块之前,它会合并「你的校准」进全局 RECIPES -->
<script src="core/recipebook.js?v=08100315"></script>

<!-- 纯函数层:不碰 DOM,能被 vitest 直接测 -->
<script src="core/profile.js?v=08100315"></script>
<script src="core/pinyin.js?v=08100315"></script>
<script src="core/timing.js?v=08100315"></script>

<script src="core/pantry.js?v=08100315"></script>
<script src="core/nutrition.js?v=08100315"></script>
<script src="core/meal.js?v=08100315"></script>

<script src="core/stats.js?v=08100315"></script>
<script src="core/solver.js?v=08100315"></script>
<!-- 一轮做饭的业务逻辑 —— 必须在 ui/rounds.js 之前,而且要在 solver 之后 -->
<script src="core/roundflow.js?v=08100315"></script>

<!-- 展示层:只做渲染和事件绑定 -->
<script src="ui/dom.js?v=08100315"></script>

</html>
